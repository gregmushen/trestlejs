name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build
        env:
          APP_URL: "${{ vars.APP_URL }}"
          SITE_URL: "${{ vars.SITE_URL }}"
      - name: Validate encrypted credentials
        run: pnpm exec trestle secrets check --env preview
        env: { TRESTLE_MASTER_KEY: "${{ secrets.TRESTLE_MASTER_KEY }}" }
      - name: Configure preview database roles
        run: |
          database_migration_url="$(pnpm exec trestle secrets get DATABASE_MIGRATION_URL --env preview --raw)"
          export DATABASE_MIGRATION_URL="$database_migration_url"
          pnpm --filter ./packages/db db:roles:configure
        env:
          TRESTLE_MASTER_KEY: "${{ secrets.TRESTLE_MASTER_KEY }}"
          DATABASE_RUNTIME_ROLE: "${{ vars.DATABASE_RUNTIME_ROLE }}"
      - name: Migrate preview database
        run: |
          database_url="$(pnpm exec trestle secrets get DATABASE_MIGRATION_URL --env preview --raw)"
          export DATABASE_URL="$database_url"
          pnpm db:migrate
        env: { TRESTLE_MASTER_KEY: "${{ secrets.TRESTLE_MASTER_KEY }}" }
      - name: Verify preview runtime role
        run: |
          database_url="$(pnpm exec trestle secrets get DATABASE_URL --env preview --raw)"
          export DATABASE_URL="$database_url"
          pnpm --filter ./packages/db db:roles:verify
        env:
          TRESTLE_MASTER_KEY: "${{ secrets.TRESTLE_MASTER_KEY }}"
          DATABASE_RUNTIME_ROLE: "${{ vars.DATABASE_RUNTIME_ROLE }}"
      - name: Push preview Worker secrets
        run: pnpm exec trestle secrets push --env preview
        env:
          TRESTLE_MASTER_KEY: "${{ secrets.TRESTLE_MASTER_KEY }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          accountId: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          packageManager: pnpm
          workingDirectory: apps/worker
          command: deploy --env preview --var WEB_ORIGIN:${{ vars.APP_URL }}
      - run: VITE_API_ORIGIN="${{ vars.API_URL }}" pnpm --filter @__TRESTLE_PROJECT_NAME__/app build
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          accountId: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          packageManager: pnpm
          workingDirectory: apps/app
          command: pages deploy dist --project-name __TRESTLE_PROJECT_NAME__-preview --branch pr-${{ github.event.pull_request.number }}
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          accountId: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          packageManager: pnpm
          workingDirectory: apps/site
          command: pages deploy dist --project-name __TRESTLE_PROJECT_NAME__-site-preview --branch pr-${{ github.event.pull_request.number }}
      - run: node scripts/smoke.mjs
        env: { SITE_URL: "${{ vars.SITE_URL }}", APP_URL: "${{ vars.APP_URL }}", API_URL: "${{ vars.API_URL }}" }
