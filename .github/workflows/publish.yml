name: Publish npm packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    environment: npm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trestle_generated
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d trestle_generated"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out the release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.33.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version
        shell: bash
        run: pnpm release:check -- "${GITHUB_REF_NAME#v}"

      - name: Build and test
        run: pnpm check

      - name: Exercise a clean generated project
        run: pnpm check:generated
        env:
          TRESTLE_GENERATED_DATABASE_URL: postgres://postgres:postgres@localhost:5432/trestle_generated

      - name: Build publishable tarballs
        run: pnpm release:pack

      - name: Select npm distribution tag
        id: distribution
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish packages in dependency order
        shell: bash
        env:
          DISTRIBUTION_TAG: ${{ steps.distribution.outputs.tag }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"

          publish_if_missing() {
            local package="$1"
            local archive="$2"
            if npm view "${package}@${version}" version >/dev/null 2>&1; then
              echo "${package}@${version} is already published; skipping."
              return
            fi
            npm publish "$archive" --access public --tag "$DISTRIBUTION_TAG"
          }

          publish_if_missing "@trestlejs/core" ./release/trestlejs-core.tgz
          publish_if_missing trestlejs ./release/trestlejs.tgz
          publish_if_missing create-trestlejs ./release/create-trestlejs.tgz
